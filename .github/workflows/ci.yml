name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: tracker_test_password
          POSTGRES_DB: tracker_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_test -d tracker_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENABLE_DEV_PRO_TOGGLE: "true"
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: tracker_db_test
      TEST_PGDATABASE: tracker_db_test
      PGUSER: tracker_test
      PGPASSWORD: tracker_test_password
      # Throwaway CI-only value (32+ chars). Never a real secret.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Install Playwright Chromium (used by smoke:local)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run check:imports
      - run: npm run assets:check
      - run: npm run lint
      - run: npm run test:unit
      - name: Reset test DB
        env:
          NODE_ENV: development
        run: npm run db:reset:test
      - name: Integration tests
        env:
          NODE_ENV: development
        run: npm run test:integration
      - name: Build (production)
        env:
          NODE_ENV: production
        run: npm run build
      - name: Smoke local (dev server)
        env:
          NODE_ENV: development
        run: npm run smoke:local
      - name: Smoke preview (production dist)
        env:
          NODE_ENV: development
        run: npm run smoke:preview
